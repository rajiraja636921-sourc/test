<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* login page start */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .login-container{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: aqua;

        }
        .login-container .login{
            width: 300px;
            background-color: aliceblue;
            padding: 20px;
            border-radius: 20px;

        }
        .login-container .login h2{
            text-align: center;
            margin-bottom: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .login-container .login form{
            display: flex;
            flex-direction: column;
        }
        .login-container .login form label{
            margin-bottom: 5px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .login-container .login form input{
            margin-bottom: 15px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid gray;
            border-radius: 10px;
        }
        .login-container .login form input:focus{
            outline: none;
            border-color: rgb(0, 179, 255);
            box-shadow: 0 0 5px lightblue;
        }
        .login-container .login form button{
            padding: 10px;
            font-size: 16px;
            background-color: rgb(0, 123, 255);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .login-container .login form button:hover{
            background-color: rgb(0, 82, 179);
        }
        .login-container .login form p{
            margin-top: 10px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            text-align: center;
        }
        .login-container .login form p a{
            text-decoration: none;
            color: rgb(0, 123, 255);
        }
        .back{
            text-align: center;
            text-decoration: none;
            color: rgb(10, 195, 227);
        }
        /* login end  */

    </style>
</head>
<body>
   <div class="login-container">
    
    <div class="login">
        <h2>Login </h2>
        <form >
            <label >User name</label>
            <input type="text" placeholder="Enter user name" required>
            <label for="">password</label>
            <input type="password" placeholder="Enter password" required>
            <button>Login</button>
            <p>Do you have register? <a href="">register</a></p>
             <a href="index.html" class="back"> back to Home</a>
            
        </form>
       
        
    </div>
   </div>
</body>
</html>
