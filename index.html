    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        .nav-conatiner{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(203, 203, 203);
            padding: 0 20px;
        }
       .nav-conatiner img{
            width: 150px;
            height: 80px;
            border: 1px solid black;
            
        }
        .nav ul{
            list-style: none;
            display: inline-flex;
        }
        .nav ul li{
            padding: 0 20px;
        }
        .nav ul li a{
            text-decoration: none;
            color: white;
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .nav ul li a:hover{
            color: rgb(6, 6, 6);
        }
        .login-btn{

            border-radius: 5px;
        }
        .nav ul li .login-btn:hover{
            background-color: rgb(6, 6, 6);
            color: white;
        }
           .container{
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 50px;
        }
         .container .box{
            width: 300px;
            border: 1px solid rgb(191, 191, 191);
            padding: 10px;
            border-radius: 10px;
         }
         .container .box img{
            width: 100%;
            height: 300px;
            object-fit: cover;
         }
         .container .box .btn{
            display: flex;
            justify-content: space-between;
         }
         .container .box .btn button{
            width: 48%;
            padding: 10px;
            border: none;
            background-color: teal;
            color: white;
            border-radius: 5px;
            cursor: pointer;
         }
         .nav-conatiner input{
            width: 400px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid black;
         }
         .nav-conatiner input::placeholder{ 
             /* pseudo class */
             color: rgb(219, 0, 0);
         }
    </style>
</head>
